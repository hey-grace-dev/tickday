# One-time: creates the EAS project on expo.dev, configures EAS Update,
# and commits the resulting app.json changes back to the repo.
name: EAS setup (run once)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: eas init --non-interactive --force
      - run: eas update:configure --non-interactive
      - name: Commit config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json eas.json
          git diff --cached --quiet || git commit -m "Link EAS project and configure EAS Update"
          git push
